<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <title id="title">Dell Chromebook 3100 illustration</title>
  <desc id="desc">A simple Chromebook illustration used as a local asset lookup image.</desc>
  <defs>
    <linearGradient id="screen" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#cfd7e3"/>
    </linearGradient>
    <linearGradient id="body" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#31373d"/>
      <stop offset="1" stop-color="#161a1f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="900" height="560" rx="40" fill="#f4f7f4"/>
  <g filter="url(#shadow)">
    <rect x="165" y="76" width="570" height="350" rx="26" fill="url(#body)"/>
    <rect x="195" y="108" width="510" height="286" rx="12" fill="url(#screen)"/>
