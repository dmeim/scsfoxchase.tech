    <path d="M108 423h684l56 72c13 17 1 43-21 43H73c-22 0-34-26-21-43l56-72Z" fill="#20262c"/>
    <path d="M333 450h234l20 27H313l20-27Z" fill="#353c45"/>
    <path d="M92 502h716" stroke="#59616c" stroke-width="8" stroke-linecap="round" opacity="0.45"/>
  </g>
  <g transform="translate(320 184)">
