    <text x="130" y="64" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="900" fill="#125f31">3100</text>
  </g>
  <circle cx="714" cy="450" r="18" fill="#f6d724"/>
  <text x="714" y="456" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="900" fill="#125f31">SCS</text>
